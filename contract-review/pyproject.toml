[project]
name = "contract-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gd1410", email = "167023458+gd1410@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.1",
    "langchain-groq>=1.2.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
